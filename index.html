<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fedezd fel a TanuljVelem gyakorlóanyagait</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fehér, lila és rózsaszín közötti finom átmenet */
            background: linear-gradient(135deg, #ffffff 0%, #f3e8ff 50%, #fce7f3 100%);
            color: #333333;
        }

        .promo-card {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.1);
            max-width: 600px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .promo-card h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            line-height: 1.3;
        }

        .promo-card p {
            font-size: 1.1rem;
            color: #4b5563;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .brand-name {
            font-weight: 700;
            color: #7c3aed;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.35);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(236, 72, 153, 0.45);
        }
    </style>
</head>
<body>

    <div class="promo-card">
        <h2>Fedezd fel a <span class="brand-name">TanuljVelem</span> gyakorlóanyagait!</h2>
        <p>Lépj be a tudás világába, fejleszd képességeidet, és találd meg a számodra leghasznosabb interaktív anyagokat a <span class="brand-name">TanuljVelem</span> oldalon.</p>
        <a href="https://tanulj-velem.vercel.app" class="btn" target="_blank" rel="noopener noreferrer">Irány a TanuljVelem</a>
    </div>

</body>
</html>

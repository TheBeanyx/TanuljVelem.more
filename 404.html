<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Az oldal nem található - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fehér, lila és rózsaszín közötti finom átmenet */
            background: linear-gradient(135deg, #ffffff 0%, #e8d7f1 50%, #fbcfe8 100%);
            color: #4a4a4a;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 6rem;
            color: #8b5cf6; /* Lila árnyalat */
            margin-bottom: 10px;
            font-weight: 800;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #333333;
        }

        p {
            font-size: 1rem;
            color: #666666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Hoppá! Az oldal nem található.</h2>
        <p>Úgy tűnik, hogy a keresett oldal eltűnt, vagy esetleg rossz címet adtál meg.</p>
        <a href="/" class="btn">Vissza a főoldalra</a>
    </div>

</body>
</html>
